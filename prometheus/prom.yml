global:
  scrape_interval: 15s # Default scrape interval

scrape_configs:
  # - job_name: 'prometheus'
  #   static_configs:
  #     - targets: ['localhost:9090']

  - job_name: 'coreapi-dev'
    metrics_path: /metrics
    scheme: https
    static_configs:
      - targets: ['dev.core.msbureau.com']
  - job_name: 'coreapi-prod'
    metrics_path: /metrics
    scheme: https
    static_configs:
      - targets: ['core.api.msbureau.com']
  - job_name: 'coreapi-prod-vegas'
    metrics_path: /metrics
    scheme: https
    static_configs:
      - targets: ['core.api.vegascollect.com']

  - job_name: supabase-__SUPABASE_PROJECT_REF__
    scheme: https
    metrics_path: "/customer/v1/privileged/metrics"
    params:
      supabase_grafana: ["true"]
    basic_auth:
      username: service_role
      password: __SUPABASE_SERVICE_ROLE_KEY__
    static_configs:
      - targets: ["__SUPABASE_PROJECT_REF__.supabase.co"]
        labels:
          supabase_project_ref: "__SUPABASE_PROJECT_REF__"
          supabase_identifier: "__SUPABASE_PROJECT_REF__"
  - job_name: 'clickhouse-cloud'
    scrape_interval: 60s
    scheme: https
    metrics_path: "/v1/organizations/c63b369c-f38d-4c4f-88a5-79881f3d8d8f/prometheus"
    params:
      filtered_metrics: ["true"]
    honor_labels: true
    basic_auth:
      username: __CLICKHOUSE_CLOUD_KEY_ID__
      password: __CLICKHOUSE_CLOUD_KEY_SECRET__
    static_configs:
      - targets: ["api.clickhouse.cloud"]

  #  ? TODO: add your services here
